[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stress_recovery_spectra"
version = "1.0.0"
description = "Series 6 VCSEL optical spectrum stress-recovery cycling workflow with B1500 + Avantes spectrometer"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Veronica GaoZhan"}]
keywords = ["vcsel", "b1500", "avantes", "spectroscopy", "stress recovery", "reliability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.20.0",
    "PyQt5>=5.15.0",
    "pyvisa>=1.12.0",
    "pyvisa-py>=0.5.0",
    "matplotlib>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black>=21.0",
    "flake8>=3.9",
]

[project.urls]
Homepage = "https://github.com/vvvvvero/VCSEL_Reliablity_Tests_6_Optical_Spectrum_Stress_Recovery"
Repository = "https://github.com/vvvvvero/VCSEL_Reliablity_Tests_6_Optical_Spectrum_Stress_Recovery.git"
Issues = "https://github.com/vvvvvero/VCSEL_Reliablity_Tests_6_Optical_Spectrum_Stress_Recovery/issues"

[project.scripts]
stress_recovery_spectra = "stress_recovery_spectra.__main__:main"

[tool.setuptools]
packages = ["stress_recovery_spectra"]
py-modules = ["b1500_spectrometer_stress_rcovery_cycle", "b1500_Step_stress_spectroscopy"]
include-package-data = true

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
